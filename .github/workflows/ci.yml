name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
        # integration tests are guarded by the `integration` build tag and
        # require Postgres/Redis. They are not run in this job.

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Provide fallback values so type-check / build still work when `.env`
      # is missing. Production containers override them via runtime config.
      VITE_CASDOOR_SERVER_URL: https://casdoor.example.com
      VITE_CASDOOR_CLIENT_ID: ci-placeholder
      VITE_CASDOOR_ORG_NAME: ci-placeholder
      VITE_CASDOOR_APP_NAME: ci-placeholder
      VITE_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm run test

  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on push to main/develop. PRs from forks do not have access to
    # secrets, so we skip the Docker build there to avoid spurious failures.
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: dotblue:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: dotblue-web:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
