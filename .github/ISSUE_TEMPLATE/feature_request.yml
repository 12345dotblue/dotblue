name: Feature request
description: Suggest an idea for DotBlue.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would like to see and how it would help you.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Why is it worth solving?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch UI / API changes if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why this one?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, deployment constraints.
    validations:
      required: false
