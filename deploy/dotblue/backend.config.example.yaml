server:
  address: ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

database:
  default:
    link: "pgsql:__DOTBLUE_DB_USER__:__DOTBLUE_DB_PASSWORD__@tcp(postgres:5432)/__DOTBLUE_DB_NAME__"
    debug: true

casdoor:
  endpoint: "__CASDOOR_INTERNAL_URL__"
  clientId: "__DOTBLUE_CASDOOR_CLIENT_ID__"
  clientSecret: "__DOTBLUE_CASDOOR_CLIENT_SECRET__"
  jwtSecret: |
__DOTBLUE_CASDOOR_CERT_PEM_BLOCK__
  organizationName: "__CASDOOR_ORG_NAME__"
  applicationName: "__CASDOOR_APP_NAME__"
  bootstrap:
    endpoint: ""
    clientId: ""
    clientSecret: ""
    jwtSecret: ""

setup:
  initDataPath: ""

files:
  driver: "__DOTBLUE_FILES_DRIVER__"
  localRoot: "__DOTBLUE_FILES_LOCAL_ROOT__"
  s3:
    endpoint: "__DOTBLUE_S3_ENDPOINT__"
    region: "__DOTBLUE_S3_REGION__"
    bucket: "__DOTBLUE_S3_BUCKET__"
    accessKey: "__DOTBLUE_S3_ACCESS_KEY__"
    secretKey: "__DOTBLUE_S3_SECRET_KEY__"
    sessionToken: "__DOTBLUE_S3_SESSION_TOKEN__"
    forcePathStyle: __DOTBLUE_S3_FORCE_PATH_STYLE__
    autoCreateBucket: __DOTBLUE_S3_AUTO_CREATE_BUCKET__

logger:
  level: "all"
  stdout: true

debug:
  sse: true

im:
  asyncTurn: true

redis:
  address: "redis:6379"
  password: ""
  db: 0
  keyPrefix: "dot"

session:
  ownerTTL: "30s"
  fenceTTL: "2m"
  gateTTL: "2m"
  stateTTL: "2h"

worker:
  id: "compose-all-in-one"
  embedded: true
  metaTTL: "30s"
  heartbeatInterval: "10s"
  inboxTTL: "2h"
  claimBlock: "2s"

dataplane:
  requestStateRunningTTL: "30m"
  requestStateFinalTTL: "1h"
  streamMaxLen: 5000

engine:
  dataBasePath: "__DOTBLUE_ENGINE_HOST_DATA_PATH__"
  dataMountPath: "__DOTBLUE_ENGINE_MOUNT_DATA_PATH__"
  containerPort: 8642
  runtimeMode: "__DOTBLUE_ENGINE_RUNTIME_MODE__"
  endpointMode: "__DOTBLUE_ENGINE_ENDPOINT_MODE__"
  dockerEndpoint: "__DOTBLUE_ENGINE_DOCKER_ENDPOINT__"
  dockerNetwork: "__DOTBLUE_ENGINE_DOCKER_NETWORK__"
